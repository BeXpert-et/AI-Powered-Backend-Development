<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><rect width="1000" height="370" rx="16" fill="#FAF7E5"/><style>text{font:20px Arial;fill:#34302A}.h{font-size:29px;font-weight:bold;fill:#0B3784}.t{font-size:22px;font-weight:bold;fill:#0B3784}</style><text x="32" y="47" class="h">Synchronous work vs asynchronous waiting</text><text x="34" y="96" class="t">Synchronous</text><rect x="34" y="111" width="268" height="76" rx="12" fill="#284E90"/><text x="59" y="155" fill="#ffffff">Do work A</text><rect x="314" y="111" width="268" height="76" rx="12" fill="#0B3784"/><text x="336" y="155" fill="#ffffff">Finish A</text><rect x="594" y="111" width="372" height="76" rx="12" fill="#F9D100"/><text x="616" y="155">Then do work B</text><text x="34" y="233" class="t">Async waiting</text><rect x="34" y="252" width="210" height="76" rx="12" fill="#284E90"/><text x="48" y="297" fill="#ffffff">Start request</text><rect x="255" y="252" width="310" height="76" rx="12" fill="#F9D100"/><text x="277" y="297">Do other work</text><rect x="578" y="252" width="388" height="76" rx="12" fill="#0B3784"/><text x="597" y="297" fill="#ffffff">Handle completed result</text></svg>