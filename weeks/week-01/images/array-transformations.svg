<style>text{font-family:Arial, sans-serif;fill:#0b3784}.heading{font-size:26px;font-weight:bold}.label{font-size:22px;font-weight:bold}.small{font-size:17px;fill:#34302a}.box{fill:#fff;stroke:#0b3784;stroke-width:2}.accent{fill:#f9d100;stroke:#0b3784;stroke-width:2}</style>
